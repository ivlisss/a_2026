<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="page-content">
        <div class="container">
            <header class="header">
                <div class="logo">
                    <img src="media/export48_dark (1).svg" alt="logo-image" class="logo-image">
                </div>>

                <button class="burger-menu">
                    <span class="burger-line"></span>
                    <span class="burger-line"></span>
                    <span class="burger-line"></span>
                </button>

                <div class="nav">
                    <ul class="nav-list">
                        <li class="nav-item"><a href="index.html#search">Поиск</a></li>
                        <li class="nav-item"><a href="login.html">Войти</a></li>
                        <li class="nav-item"><a href="profile.html">Личный кабинет</a></li>
                        <li class="nav-item"><a href="catalog.html">Каталог игр</a></li>
                    </ul>
                </div>
            </header>
        </div>

        <main class="main">
            <div class="auth-container" style="max-width: 500px; margin: 3rem auto;">


                <form class="auth-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="email" class="form-label">E-mail *</label>
                            <input type="email" id="email" class="form-control" placeholder="your@email.com" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="lastName" class="form-label">Фамилия *</label>
                            <input type="text" id="lastName" class="form-control" placeholder="Иванов" required>
                        </div>

                        <div class="form-group">
                            <label for="firstName" class="form-label">Имя *</label>
                            <input type="text" id="firstName" class="form-control" placeholder="Иван" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="birthDate" class="form-label">Дата рождения *</label>
                        <input type="date" id="birthDate" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label for="phone" class="form-label">Номер телефона *</label>
                        <input type="tel" id="phone" class="form-control" placeholder="+7 (999) 999-99-99" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="password" class="form-label">Пароль *</label>
                            <input type="password" id="password" class="form-control" placeholder="Не менее 8 символов"
                                required>
                        </div>

                        <div class="form-group">
                            <label for="confirmPassword" class="form-label">Повтор пароля *</label>
                            <input type="password" id="confirmPassword" class="form-control"
                                placeholder="Повторите пароль" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-check">
                            <input type="checkbox" class="form-check-input" required>
                            <span>Я согласен на обработку персональных данных *</span>
                        </label>
                    </div>

                    <button type="submit" class="btn btn--accent" style="width: 100%; margin-bottom: 1rem;">
                        Зарегистрироваться
                    </button>

                    <div class="text-center">
                        <p>Уже есть аккаунт? <a href="login.html" class="footer__link">Войти</a></p>
                    </div>
                </form>
            </div>
        </main>
        <div class="container">
            <footer class="footer">
                <div class="info">
                    <ul class="info-list">
                        <li>Телефон (+7-800-999-55-99)</li>
                        <li>e-mail: best@games.ru</li>
                        <li><a href="#">Клиентам</a></li>
                        <li><a href="#">Партнерам</a></li>
                        <li><a href="#">О нас</a></li>
                        <li><a href="#">Контакты</a></li>
                    </ul>
                </div>
                <div class="footer-nav">
                    <ul class="footer-nav-list">
                        <li class="nav-item"><a href="index.html">Поиск</a></li>
                        <li class="nav-item"><a href="login.html">Войти</a></li>
                        <li class="nav-item"><a href="profile.html">Личный кабинет</a></li>
                        <li class="nav-item"><a href="catalog.html">Каталог игр</a></li>
                    </ul>
                </div>
            </footer>
        </div>
    </div>
</body>

</html>
