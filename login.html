    <div class="page-content">
        <div class="container">
            <header class="header">
                <div class="logo">
                    <img src="media/export48_dark (1).svg" alt="logo-image" class="logo-image">

                <button class="burger-menu">
                    <span class="burger-line"></span>

                        Войти
